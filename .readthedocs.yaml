# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  # Use development packages from docker/ubuntu_22_04_base
  apt_packages:
    - casacore-dev
    - cmake
    - doxygen
    - g++
    - libboost-all-dev
    - libcfitsio-dev
    - libfftw3-dev
    - libgsl-dev
    - libhdf5-dev
    - libpython3-dev
    - ninja-build
    - python3-pip
  jobs:
    # Build the .so with the python bindings, including docstrings.
    pre_build:
      # Copy casacore headers and patch things that no longer work in C++20.
      - mkdir include
      - cp -r /usr/include/casacore include/
      - patch -p1 < doc/casacore-c++20.patch

      # Build Radler and its documentation
      - mkdir build
      - cmake -DCMAKE_CXX_FLAGS=-I$(pwd)/include -DBUILD_PYTHON_BINDINGS=ON -DBUILD_DOCUMENTATION=ON -G Ninja -S . -B build
      - cd build && ninja && ninja doxygen_xml

sphinx:
   configuration: doc/conf.py

python:
   install:
     - requirements: doc/requirements.txt
